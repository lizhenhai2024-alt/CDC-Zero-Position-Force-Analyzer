name: Tests

on:
  push:
    branches: [main, "dev-*"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,gui]"
      - name: Verify private Golden evidence
        run: python tools/verify_golden_evidence.py
      - name: Test core and GUI smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
