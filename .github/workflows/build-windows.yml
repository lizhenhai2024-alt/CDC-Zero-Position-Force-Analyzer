name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ["dev-*"]
    paths:
      - "src/**"
      - "golden/**"
      - "tools/**"
      - "launcher.py"
      - "pyproject.toml"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]" pyinstaller pillow
      - name: Verify private Golden evidence
        run: python tools/verify_golden_evidence.py
      - name: Render application icon
        run: python tools/render_app_icon.py
      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name Damper_Test_Data_Analyzer --icon "src/cdc_analyzer/assets/damper_test_data_analyzer.png" --paths src --collect-all pyqtgraph --hidden-import pyqtgraph.exporters --add-data "src/cdc_analyzer/assets;cdc_analyzer/assets" launcher.py
      - name: Generate SHA256 and provenance
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/Damper_Test_Data_Analyzer.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Damper_Test_Data_Analyzer.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          "commit=${{ github.sha }}" | Out-File -Encoding ascii dist/BUILD_PROVENANCE.txt
          "ref=${{ github.ref }}" | Out-File -Encoding ascii -Append dist/BUILD_PROVENANCE.txt
          "python=3.12" | Out-File -Encoding ascii -Append dist/BUILD_PROVENANCE.txt
          "run_id=${{ github.run_id }}" | Out-File -Encoding ascii -Append dist/BUILD_PROVENANCE.txt
          "golden_evidence=golden/evidence_v09.json" | Out-File -Encoding ascii -Append dist/BUILD_PROVENANCE.txt
      - name: Upload release-grade build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Damper_Test_Data_Analyzer_Windows
          path: |
            dist/Damper_Test_Data_Analyzer.exe
            dist/SHA256SUMS.txt
            dist/BUILD_PROVENANCE.txt
            golden/manifest.json
            golden/evidence_v09.json
          if-no-files-found: error
