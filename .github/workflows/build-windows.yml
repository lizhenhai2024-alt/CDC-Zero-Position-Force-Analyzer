name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ["dev-*"]
    paths:
      - "src/**"
      - "tools/**"
      - "launcher.py"
      - "pyproject.toml"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official FAWER-TOKICO logo
        run: python tools/fetch_official_logo.py
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]" pyinstaller
      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name CDC_Test_Data_Analyzer --paths src --collect-all pyqtgraph --hidden-import pyqtgraph.exporters --add-data "src/cdc_analyzer/assets;cdc_analyzer/assets" launcher.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: CDC_Test_Data_Analyzer_Windows
          path: dist/CDC_Test_Data_Analyzer.exe
          if-no-files-found: error
