name: V0.9 Source Snapshot

on:
  push:
    branches:
      - dev-v0.9-architecture-validation-freeze
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source snapshot
        run: |
          zip -r cdc-source.zip . -x '.git/*' 'cdc-source.zip'
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: v09-source-snapshot
          path: cdc-source.zip
          retention-days: 1
