name: V0.9 Runtime Consolidation

on:
  push:
    branches: ["dev-v0.9-architecture-validation-freeze"]
    paths:
      - ".github/workflows/v09-consolidate-runtime.yml"

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate canonical runtime modules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          srcdir = Path("src/cdc_analyzer")
          dynamic_layers = [
              ("074", "dynamic_gui_v074.py"),
              ("075", "dynamic_gui_v075.py"),
              ("076", "dynamic_gui_v076.py"),
              ("077", "dynamic_gui_v077.py"),
              ("078", "dynamic_gui_v078.py"),
              ("079", "dynamic_gui_v079.py"),
              ("080", "dynamic_gui_v080.py"),
              ("081", "dynamic_gui_v081.py"),
              ("083", "dynamic_gui_v083.py"),
              ("084", "dynamic_gui_v084.py"),
          ]

          imports = '''from __future__ import annotations

          from pathlib import Path
          from tempfile import TemporaryDirectory

          import numpy as np
          from openpyxl import load_workbook
          from openpyxl.drawing.image import Image as XLImage

          from .dynamic_analysis import CURRENT, LOAD, TIME, VELOCITY, ResponseConfig, ResponseStandard
          from .dynamic_export import export_hysteresis_xlsx, export_response_xlsx
          from .dynamic_gui import DynamicPagesController as _BaseDynamicPagesController
          from .response_v074 import analyze_response_time_v074
          from .response_v075 import analyze_response_time_v075
          from .response_v080 import analyze_response_time_v080, default_target_speeds, parse_target_speeds


          class _AnalyzerModuleProxy:
              """Compatibility proxy for historical controller analyzer redirection."""
              def __getattr__(self, name):
                  return globals()[name]

              def __setattr__(self, name, value):
                  globals()[name] = value


          _v074_module = _AnalyzerModuleProxy()
          _dynamic_gui_v074_module = _v074_module
          _v074_module.analyze_response_time_v074 = analyze_response_time_v075
          '''

          parts = [imports]
          previous = "_BaseDynamicPagesController"
          for version, filename in dynamic_layers:
              text = (srcdir / filename).read_text(encoding="utf-8")
              tree = ast.parse(text)
              cls = next(
                  node for node in tree.body
                  if isinstance(node, ast.ClassDef) and node.name == "DynamicPagesController"
              )
              lines = text.splitlines()
              segment = "\n".join(lines[cls.lineno - 1:cls.end_lineno])
              old_header = segment.splitlines()[0]
              segment = segment.replace(
                  old_header,
                  f"class _Layer{version}({previous}):",
                  1,
              )
              parts.append(
                  f"\n\n# Consolidated behavior layer {version}\n{segment}\n"
              )
              previous = f"_Layer{version}"

          parts.append(
              f'''\n\nclass DynamicPagesController({previous}):
              """Canonical V0.9 runtime controller preserving V0.8.4 behavior.

              Production code no longer imports dynamic_gui_v07x/v08x modules.
              Historical files remain only as regression references during the freeze.
              """
              pass
              '''
          )
          runtime_dynamic = "".join(parts)
          ast.parse(runtime_dynamic)
          (srcdir / "runtime_dynamic_gui.py").write_text(runtime_dynamic, encoding="utf-8")

          def extract_functions(path: Path, names: set[str]) -> str:
              text = path.read_text(encoding="utf-8")
              tree = ast.parse(text)
              lines = text.splitlines()
              chunks = []
              for node in tree.body:
                  if isinstance(node, ast.FunctionDef) and node.name in names:
                      chunks.append("\n".join(lines[node.lineno - 1:node.end_lineno]))
              return "\n\n\n".join(chunks)

          helpers = extract_functions(
              srcdir / "gui_release_v075.py",
              {
                  "_refresh_tab_controls",
                  "_show_help_dialog",
                  "_install_tab_language_help",
                  "_build_release_gui_classes_v075",
              },
          )
          build_v076 = extract_functions(
              srcdir / "gui_release_v076.py",
              {"_build_release_gui_classes_v076"},
          )

          runtime_release = f'''from __future__ import annotations

          import sys
          from pathlib import Path

          from . import gui_release as _base_release
          from .dynamic_analysis import load_dynamic_test_data
          from .gui import _qt_imports
          from .i18n import tr
          from .product_info import COMPANY_EN, PRODUCT_NAME
          from .runtime_dynamic_gui import DynamicPagesController


          {helpers}


          {build_v076}


          def _build_release_gui_classes():
              """Build canonical V0.9 shell while preserving released V0.8.4 behavior."""
              _QtCore, QtWidgets, _pg = _qt_imports()
              BaseMainWindow = _build_release_gui_classes_v076()

              class MainWindow(BaseMainWindow):
                  def _show_about_dialog(self):
                      QtWidgets.QMessageBox.information(
                          self,
                          "关于软件" if self.language == "zh_CN" else "About",
                          (
                              "Damper Test Data Analyzer\\n"
                              "减振器 / CDC 试验数据分析工具\\n"
                              "V0.8.4"
                              if self.language == "zh_CN"
                              else "Damper Test Data Analyzer\\nDamper / CDC test-data analysis\\nV0.8.4"
                          ),
                      )

              return MainWindow


          def main() -> int:
              _QtCore, QtWidgets, _pg = _qt_imports()
              MainWindow = _build_release_gui_classes()
              app = QtWidgets.QApplication.instance() or QtWidgets.QApplication(sys.argv)
              app.setApplicationName(PRODUCT_NAME)
              app.setOrganizationName(COMPANY_EN)
              window = MainWindow()
              window.show()
              return int(app.exec())


          if __name__ == "__main__":  # pragma: no cover
              raise SystemExit(main())
          '''
          # Remove indentation introduced by the YAML heredoc while preserving Python nesting.
          import textwrap
          runtime_release = textwrap.dedent(runtime_release)
          ast.parse(runtime_release)
          (srcdir / "runtime_gui_release.py").write_text(runtime_release, encoding="utf-8")

          launcher = Path("launcher.py")
          launcher.write_text(
              launcher.read_text(encoding="utf-8").replace(
                  "cdc_analyzer.gui_release_v084",
                  "cdc_analyzer.runtime_gui_release",
              ),
              encoding="utf-8",
          )

          pyproject = Path("pyproject.toml")
          pyproject.write_text(
              pyproject.read_text(encoding="utf-8").replace(
                  "cdc_analyzer.gui_release_v084:main",
                  "cdc_analyzer.runtime_gui_release:main",
              ),
              encoding="utf-8",
          )

          test_file = Path("tests/test_runtime_architecture.py")
          test_file.write_text(r'''from __future__ import annotations

          import inspect
          from pathlib import Path

          import pytest

          from cdc_analyzer import runtime_dynamic_gui, runtime_gui_release


          def test_canonical_runtime_has_no_versioned_gui_imports():
              dynamic_source = inspect.getsource(runtime_dynamic_gui)
              release_source = inspect.getsource(runtime_gui_release)
              assert "from .dynamic_gui_v" not in dynamic_source
              assert "from .gui_release_v" not in release_source
              assert "from .dynamic_gui_v" not in release_source


          def test_canonical_controller_mro_is_self_contained():
              modules = {cls.__module__ for cls in runtime_dynamic_gui.DynamicPagesController.__mro__}
              assert "cdc_analyzer.runtime_dynamic_gui" in modules
              assert not any(module.startswith("cdc_analyzer.dynamic_gui_v") for module in modules)


          def test_production_entrypoints_use_canonical_runtime():
              root = Path(__file__).resolve().parents[1]
              launcher = (root / "launcher.py").read_text(encoding="utf-8")
              pyproject = (root / "pyproject.toml").read_text(encoding="utf-8")
              assert "cdc_analyzer.runtime_gui_release" in launcher
              assert "cdc_analyzer.runtime_gui_release:main" in pyproject
              assert "gui_release_v084" not in launcher


          def test_canonical_gui_builds_when_qt_available(monkeypatch):
              pytest.importorskip("PySide6")
              monkeypatch.setenv("QT_QPA_PLATFORM", "offscreen")
              _QtCore, QtWidgets, _pg = runtime_gui_release._qt_imports()
              app = QtWidgets.QApplication.instance() or QtWidgets.QApplication([])
              MainWindow = runtime_gui_release._build_release_gui_classes()
              window = MainWindow()
              try:
                  assert window.dynamic_pages.__class__.__module__ == "cdc_analyzer.runtime_dynamic_gui"
                  assert hasattr(window.dynamic_pages, "_add_curve_intersection_marker")
                  assert hasattr(window.dynamic_pages, "response_target_speeds")
                  assert hasattr(window, "file_menu")
                  assert hasattr(window, "export_menu")
              finally:
                  window.close()
                  app.processEvents()
          ''', encoding="utf-8")
          PY

      - name: Validate generated source
        shell: bash
        run: |
          python -m py_compile src/cdc_analyzer/runtime_dynamic_gui.py src/cdc_analyzer/runtime_gui_release.py
          python -m pip install -e ".[dev]"
          pytest -q

      - name: Commit canonical runtime
        shell: bash
        run: |
          git config user.name "V0.9 Architecture Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/cdc_analyzer/runtime_dynamic_gui.py \
                  src/cdc_analyzer/runtime_gui_release.py \
                  tests/test_runtime_architecture.py \
                  launcher.py pyproject.toml
          if git diff --cached --quiet; then
            echo "No consolidation changes to commit"
            exit 0
          fi
          git commit -m "refactor: consolidate V0.9 GUI runtime chain"
          git push origin HEAD:dev-v0.9-architecture-validation-freeze
